server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: cloudsaver
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100KB
      max-request-size: 100KB
  datasource:
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:h2:mem:cloudsaver;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

cloudsaver:
  security:
    # Em produção: defina CLOUDSAVER_API_KEY e CLOUDSAVER_REQUIRE_API_KEY=true
    api-key: ${CLOUDSAVER_API_KEY:}
    require-api-key: ${CLOUDSAVER_REQUIRE_API_KEY:false}
    rate-limit-por-cliente: ${CLOUDSAVER_RATE_LIMIT_POR_CLIENTE:20}
    rate-limit-janela-minutos: ${CLOUDSAVER_RATE_LIMIT_JANELA_MINUTOS:60}
  analise:
    max-recursos: ${CLOUDSAVER_ANALISE_MAX_RECURSOS:500}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    auth-required: ${SUPABASE_AUTH_REQUIRED:false}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  prompt:
    # Limite temporário de recursos detalhados no prompt (protege tokens e melhora a resposta da IA).
    max-recursos: ${GROQ_PROMPT_MAX_RECURSOS:50}
    # Limite temporário global de chamadas à IA na janela abaixo (0 desativa).
    limite-requisicoes: ${GROQ_PROMPT_LIMITE_REQUISICOES:30}
    janela-minutos: ${GROQ_PROMPT_JANELA_MINUTOS:60}
