server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: cloudsaver

  # Configuração do banco de dados (datasource) 
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudsaver_db}
    username: ${DB_USERNAME:finops_user}
    password: ${DB_PASSWORD:finops_pass}
    driver-class-name: org.postgresql.Driver

  # Configuração do JPA (Hibernate)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuração do Flyway - Database Migrations 
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration


# Configuração da AWS SDK v2 (Software Development Kit) 
aws:
  region: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  localstack:
    enabled: ${AWS_LOCALSTACK_ENABLED:false}
    endpoint: ${AWS_LOCALSTACK_ENDPOINT:http://localhost:4566}

# Configuração do Groq - IA 
groq:
  ai:
    api-key: ${GROQ_API_KEY:sua_chave_groq_aqui}
    model: ${GROQ_MODEL:llama3-8b-8192}
    url: https://api.groq.com/openai/v1/chat/completions

# Configuração do Spring Boot Actuator - Monitoramento e Health Checks  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always