server:
  port: 8080

spring:
  application:
    name: cloudsaver
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${CLOUDSAVER_UPLOAD_MAX_FILE:128KB}
      max-request-size: ${CLOUDSAVER_UPLOAD_MAX_FILE:128KB}

cloudsaver:
  analise:
    # Inventários típicos ~3 KB; acima disso aumenta custo/risco na IA.
    tamanho-max-kb: ${CLOUDSAVER_ANALISE_TAMANHO_MAX_KB:128}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  prompt:
    # Limite temporário de recursos detalhados no prompt (protege tokens e melhora a resposta da IA).
    max-recursos: ${GROQ_PROMPT_MAX_RECURSOS:50}
    # Limite temporário global de chamadas à IA na janela abaixo (0 desativa).
    limite-requisicoes: ${GROQ_PROMPT_LIMITE_REQUISICOES:30}
    janela-minutos: ${GROQ_PROMPT_JANELA_MINUTOS:60}
