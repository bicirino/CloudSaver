server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: cloudsaver
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100KB
      max-request-size: 100KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

cloudsaver:
  security:
    # Em produção: defina CLOUDSAVER_API_KEY e CLOUDSAVER_REQUIRE_API_KEY=true
    api-key: ${CLOUDSAVER_API_KEY:}
    require-api-key: ${CLOUDSAVER_REQUIRE_API_KEY:false}
    rate-limit-por-cliente: ${CLOUDSAVER_RATE_LIMIT_POR_CLIENTE:20}
    rate-limit-janela-minutos: ${CLOUDSAVER_RATE_LIMIT_JANELA_MINUTOS:60}
  analise:
    max-recursos: ${CLOUDSAVER_ANALISE_MAX_RECURSOS:500}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  prompt:
    # Limite temporário de recursos detalhados no prompt (protege tokens e melhora a resposta da IA).
    max-recursos: ${GROQ_PROMPT_MAX_RECURSOS:50}
    # Limite temporário global de chamadas à IA na janela abaixo (0 desativa).
    limite-requisicoes: ${GROQ_PROMPT_LIMITE_REQUISICOES:30}
    janela-minutos: ${GROQ_PROMPT_JANELA_MINUTOS:60}
