<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CloudSaver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    
    <main class="login-shell">
        <div class="login-intro">
            <p class="login-kicker">CloudSaver</p>
            <h1>Análise de recursos AWS</h1>
            <p>Faça login para enviar seu relatório JSON e visualizar custos estimados e recomendações.</p>
        </div>

        <form id="login-form" onsubmit="realizarLogin(event)">
        <div class="title">
            <span class="logo-mark" aria-hidden="true">CS</span>
            <h2>Entrar no CloudSaver</h2>
            <p>Use suas credenciais para continuar.</p>
        </div>

        <div class="input-group">
            <label for="user-name">Usuário ou e-mail <span class="obrigatorio">*</span></label>
            <input type="text" id="user-name" placeholder="Digite seu usuário ou e-mail" autocomplete="username" required>

            <label for="password">Senha <span class="obrigatorio">*</span></label>
            <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>

        </div>

        <button type="submit" class="enviar">Continuar</button>
        <p class="login-security"><span aria-hidden="true">●</span> Acesso protegido</p>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
