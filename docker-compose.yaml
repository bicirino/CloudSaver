services: 
  
  # Serviço principal da aplicação, que será construído a partir do Dockerfile  
  app: 
    # Constrói a imagem a partir do Dockerfile, ao invés de usar uma imagem pronta
    build: . 
    
    # Mapeia as portas da aplicação 
    ports: 
      - "8080:8080"
    
    # Variáveis abaixo usam o .env na raiz do projeto (substituição do Compose).
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_URL=${GROQ_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_PROMPT_MAX_RECURSOS=${GROQ_PROMPT_MAX_RECURSOS:-50}
      - GROQ_PROMPT_LIMITE_REQUISICOES=${GROQ_PROMPT_LIMITE_REQUISICOES:-30}
      - GROQ_PROMPT_JANELA_MINUTOS=${GROQ_PROMPT_JANELA_MINUTOS:-60}
      - CLOUDSAVER_API_KEY=${CLOUDSAVER_API_KEY:-}
      - CLOUDSAVER_REQUIRE_API_KEY=${CLOUDSAVER_REQUIRE_API_KEY:-false}
      - CLOUDSAVER_RATE_LIMIT_POR_CLIENTE=${CLOUDSAVER_RATE_LIMIT_POR_CLIENTE:-20}
      - CLOUDSAVER_RATE_LIMIT_JANELA_MINUTOS=${CLOUDSAVER_RATE_LIMIT_JANELA_MINUTOS:-60}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_AUTH_REQUIRED=${SUPABASE_AUTH_REQUIRED:-false}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}

    # Garante que o container reinicie automaticamente caso ele falhe até que seja parado manualmente
    restart: unless-stopped    

  # Jenkins para CI local. Porta 8081 só em localhost.
  # docker.sock é necessário para o stage "Build Docker Image" do Jenkinsfile.
  jenkins: 
    build:
      context: . 
      dockerfile: Dockerfile.jenkins
    image: jenkins/jenkins:2.516.3-lts-jdk17 
    ports: 
      - "127.0.0.1:8081:8080"
    volumes: 
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped 
    user: root

# Declara e cria oficialmente o volume gerido pelo Docker 
volumes: 
  jenkins_home: 
